{# The logo has a version for light and for dark page backgrounds; app.css
   shows the one that suits the page. The heading stays an h1 for screen
   readers, and in the desktop app it is a handle for dragging the window. #}
<h1 class="logo">
  <img class="logo-for-light" src="/static/logo-light-bg.svg" alt="AWS Event AMP"
    width="281" height="72" draggable="false">
  <img class="logo-for-dark" src="/static/logo-dark-bg.svg" alt="AWS Event AMP"
    width="281" height="72" draggable="false">
</h1>
